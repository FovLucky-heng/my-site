<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的第一页</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
<header>
    <h1>小明</h1>
    <p>正在从 0 到 1 学做网页。</p>
    <div id="admin-bar">
        <label for="admin-key">管理员密钥</label>
        <input id="admin-key" type="password" placeholder="发布和删除需要它" autocomplete="off" />
        <span id="admin-state"></span>
    </div>
</header>

<main>
    <section>
        <h2>关于我</h2>
        <p>住在杭州，白天上班，晚上写代码。</p>
        <img src="./images/img.png" alt="我的头像" />
    </section>

    <section>
        <h2>我会什么</h2>
        <ul></ul>
        <form id="skill-form">
            <input id="skill-input" type="text" placeholder="加一项技能" autocomplete="off" />
            <button type="submit">添加</button>
        </form>
    </section>

    <section>
        <h2>最近动态</h2>
        <p id="feed-status">加载中…</p>
        <ul id="feed"></ul>
        <form id="feed-form">
            <input id="feed-input" type="text" placeholder="写一条新动态" autocomplete="off" />
            <button type="submit">发布</button>
        </form>
        <button id="feed-retry" type="button" hidden>重试</button>
    </section>

    <section>
        <h2>联系我</h2>
        <p><a href="mailto:hi@example.com">hi@example.com</a></p>

        <form action="#" method="post">
            <p>
                <label for="name">姓名</label>
                <input id="name" name="name" type="text" placeholder="怎么称呼你" required />
            </p>

            <p>
                <label for="email">邮箱</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required />
            </p>

            <p>
                <label for="message">留言</label>
                <textarea id="message" name="message" rows="4" placeholder="想说什么"></textarea>
            </p>

            <button type="submit">发送</button>
        </form>
        <p id="contact-status"></p>
    </section>
</main>

<footer>
    <p>© 2026 小明</p>
</footer>
<script src="./app.js"></script>
</body>
</html>
